name: Deploy to GCP via Native SSH
on:
  push:
    branches:
      - MongoDB_branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      # --- 1. Setup SSH Key and Agent ---
      - name: Setup SSH Key and Agent
        run: |
          # Create SSH directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write private key to file
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Start SSH agent and add key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          
          # Add known hosts
          ssh-keyscan ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts
          
      # --- 2. Copy Files via SCP ---
      - name: Copy files to GCP VM via SCP
        run: |
          scp -r -o StrictHostKeyChecking=no \
            . \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.GCP_VM_IP }}:/home/midhun/Watch_api
            
      # --- 3. Restart Django Service via SSH ---
      - name: Restart Django Service
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.GCP_VM_IP }} \
            'sudo systemctl restart django.service'
