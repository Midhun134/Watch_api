name: Deploy to GCP via Native SSH

on:
  push:
    branches:
      - MongoDB_branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- 1. NEW: Load Encrypted SSH Key into Agent ---
      # Use the shimataro action which supports the passphrase input
      - name: Load Encrypted SSH Key
        uses: shimataro/ssh-key-action@v2 
        with:
          # This contains the content of your working .pem file!
          key: ${{ secrets.GCP_SSH_KEY }}
          # This input securely supplies the passphrase to ssh-add
          passphrase: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
          
      # --- 2. Add Host to known_hosts ---
      - name: Add GCP VM to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts

      # --- 3. Copy Files via SCP ---
      - name: Copy files to GCP VM via SCP
        run: |
          # The key is now loaded by the action. We can remove the -i option.
          scp -r \
            -o StrictHostKeyChecking=no \
            . \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:/home/midhun/Watch_api

      # --- 4. Restart Django Service via SSH ---
      - name: Restart Django Service
        run: |
          # The agent handles the key
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} \
            'sudo systemctl restart django.service'
