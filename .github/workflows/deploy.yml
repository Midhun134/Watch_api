name: Deploy to GCP via Native SSH
on:
  push:
    branches:
      - MongoDB_branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      # --- 1. Decrypt SSH Key (One-Time Setup) ---
      - name: Setup Decrypted SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write encrypted key to file
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/deploy_key_encrypted
          chmod 600 ~/.ssh/deploy_key_encrypted
          
          # Decrypt using OpenSSL (more reliable than ssh-add with passphrase)
          openssl rsa \
            -in ~/.ssh/deploy_key_encrypted \
            -out ~/.ssh/deploy_key \
            -passin pass:"${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}"
          chmod 600 ~/.ssh/deploy_key
          
          # Add known hosts
          ssh-keyscan ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts
          
      # --- 2. Copy Files via SCP ---
      - name: Copy files to GCP VM via SCP
        run: |
          scp -r -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            . \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.GCP_VM_IP }}:/home/midhun/Watch_api
            
      # --- 3. Restart Django Service via SSH ---
      - name: Restart Django Service
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.GCP_VM_IP }} \
            'sudo systemctl restart django.service'
