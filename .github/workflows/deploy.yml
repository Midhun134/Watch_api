name: Deploy to GCP via Native SSH
on:
  push:
    branches:
      - MongoDB_branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- 1. Install rsync ---
      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync
        
      # --- 1. Setup SSH Key ---
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts
          
      # --- 2. Sync Files via rsync ---
      - name: Sync files to GCP VM via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'venv' \
            --exclude 'env' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.vscode' \
            --exclude '.idea' \
            . \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.GCP_VM_IP }}:/home/midhun/Watch_api/
            
      # --- 3. Restart Django Service via SSH ---
      - name: Restart Django Service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.GCP_VM_IP }} 'sudo systemctl reload django.service'
