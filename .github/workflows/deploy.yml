name: Deploy to GCP via Native SSH
on:
  push:
    branches:
      - MongoDB_branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      # --- 1. Load SSH Key and Set Known Hosts ---
      - name: Load SSH Key and Set Known Hosts
        uses: shimataro/ssh-key-action@v2 
        with:
          key: ${{ secrets.GCP_SSH_KEY }}
          known_hosts: |
            34.70.163.217 ssh-rsa 
          
      # --- 2. Copy Files via SCP ---
      - name: Copy files to GCP VM via SCP
        run: |
          scp -o StrictHostKeyChecking=no -r . \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:/home/${{ secrets.GCP_VM_USER }}/Watch_api
            
      # --- 3. Restart Django Service via SSH ---
      - name: Restart Django Service
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} \
            'sudo systemctl restart django.service'
