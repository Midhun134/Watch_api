name: Deploy to GCP via SSH

on:
  push:
    branches:
      - MongoDB_branch

jobs:
  deploy:
    runs-on: ubuntu-latest  # Use a Linux runner for SSH compatibility
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Ensures ./your-script.sh is available

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan 34.70.163.217 >> ~/.ssh/known_hosts

      - name: Execute deployment script via SSH
        run: ssh -i ~/.ssh/id_ed25519 midhun@34.70.163.217 'bash -s' < ./your-script.sh
