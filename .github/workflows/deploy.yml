name: Deploy to GCP via Native SSH

on:
  push:
    branches:
      - MongoDB_branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # ... (defaults, checkout remain the same) ...

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- 1. Load Encrypted SSH Key and Set Known Hosts (CRITICAL FIX) ---
      - name: Load Encrypted SSH Key and Set Known Hosts
        uses: shimataro/ssh-key-action@v2 
        with:
          # Key content (Confirmed to be the correct PEM content)
          key: ${{ secrets.GCP_SSH_KEY }}
          
          # Passphrase input (Required for your encrypted key)
          passphrase: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
          
          # CRITICAL FIX: Explicitly providing the known_hosts entry
          known_hosts: |
            34.70.163.217 ssh-rsa 
            
      # --- 2. Copy Files via SCP (Simplified) ---
      - name: Copy files to GCP VM via SCP
        run: |
          scp -r \
            . \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:/home/midhun/Watch_api

      # --- 3. Restart Django Service via SSH (Simplified) ---
      - name: Restart Django Service
        run: |
          ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} \
            'sudo systemctl restart django.service'
